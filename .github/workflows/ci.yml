name: CI

on:
  push:
  pull_request:

jobs:
  # Pure-C logic tests, the CJK font check, and the desktop simulator under ASan/UBSan (every screen, EN and ZH).
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build libsdl2-dev python3
      - name: Logic tests and font check
        run: make -C host test
      - name: Simulator sweep (ASan/UBSan)
        run: SDL_VIDEODRIVER=dummy make -C host sim-check

  # Firmware build with the default config (Mock Mode, no secrets). Compile only: nothing here has run on hardware.
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.1
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32s3
          idf.py build
